name: Prerelease Artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write

jobs:
  release:
    needs: sandbox-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENT_EMBED_ALLOWED_ORIGINS: https://host.example.invalid
      EVE_NEXT_PRODUCTION_PORT: "4275"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .node-version
      - run: npm install --global pnpm@10.0.0
      - run: npm ci
      - run: npm run verify:ci
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e 'const { version } = require("./package.json");
          if (process.env.RELEASE_TAG !== `v${version}`) {
          console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
          process.exit(1);
          }'
      - name: Pack installable SDK artifacts
        run: |
          mkdir -p release-artifacts
          npm pack --workspace @oworker/open-agent-contracts --pack-destination release-artifacts
          npm pack --workspace @oworker/open-agent-client --pack-destination release-artifacts
          npm pack --workspace @oworker/open-agent-host --pack-destination release-artifacts
          npm pack --workspace @oworker/open-agent-ui --pack-destination release-artifacts
          npm pack --workspace @oworker/open-agent-mcp-adapter --pack-destination release-artifacts
          sha256sum release-artifacts/*.tgz > release-artifacts/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-artifacts/*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: open-agent-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
      - name: Publish immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-artifacts/*
          --verify-tag
          --generate-notes
          --prerelease

  sandbox-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SANDBOX_IMAGE: ghcr.io/${{ github.repository_owner }}/open-agent-sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve and verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish immutable sandbox runtime
        id: sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.SANDBOX_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.SANDBOX_IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha,scope=open-agent-sandbox
          cache-to: type=gha,mode=max,scope=open-agent-sandbox
      - name: Verify the published runtime by digest
        env:
          AGENT_SANDBOX_IMAGE: ${{ env.SANDBOX_IMAGE }}@${{ steps.sandbox.outputs.digest }}
        run: npm run verify:sandbox-runtime
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.SANDBOX_IMAGE }}
          subject-digest: ${{ steps.sandbox.outputs.digest }}
          push-to-registry: true
